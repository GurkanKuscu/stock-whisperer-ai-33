name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: '20'
      - run: npm install
      - run: npm run build
      - name: Deploy to VPS
        uses: appleboy/scp-action@master
        with:
          host: 207.154.212.100
          username: root
          password: ${{ secrets.VPS_PASSWORD }}
          source: "dist/*"
          target: "/var/www/html"
          strip_components: 1
